# Stitches real-time conferencing infrastructure (self-hosted).
# Brings up a LiveKit SFU + a coturn TURN server so audio/video meetings work
# reliably at scale (large rooms, restrictive/corporate NATs).
#
# Usage:
#   1) Copy deploy/.env.example -> deploy/.env and fill in the values.
#   2) docker compose -f deploy/docker-compose.yml up -d
#   3) In Stitches: Admin -> Meetings ->
#        - SFU/LiveKit: enable, URL wss://<your-domain>:7880, API key/secret from .env
#        - TURN: urls turn:<your-domain>:3478, username/credential from .env
#
# Ports: LiveKit 7880 (ws/api), 7881 (tcp rtc), 50000-60000/udp (rtc);
#        coturn 3478 (turn), 5349 (turns), 49152-65535/udp (relay).
services:
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-60000:50000-60000/udp"
    environment:
      - LIVEKIT_KEYS=${LIVEKIT_API_KEY}:${LIVEKIT_API_SECRET}

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    command: >
      -n
      --realm=${TURN_REALM}
      --listening-port=3478
      --tls-listening-port=5349
      --min-port=49152
      --max-port=65535
      --user=${TURN_USERNAME}:${TURN_CREDENTIAL}
      --lt-cred-mech
      --no-cli
      --no-tcp-relay
      --external-ip=${TURN_PUBLIC_IP}
