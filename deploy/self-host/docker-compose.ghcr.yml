# Pull-based self-host: uses prebuilt GHCR images + Caddy for AUTOMATIC HTTPS.
# No local build required. Run from the repo root:
#
#   cp deploy/self-host/.env.backend.example backend/.env      # edit secrets
#   export GHCR_OWNER=godeskio            # your GitHub org/user (lowercase)
#   export SITE_DOMAIN=stitches.yourdomain.com                 # DNS must point here
#   docker compose -f deploy/self-host/docker-compose.ghcr.yml pull
#   docker compose -f deploy/self-host/docker-compose.ghcr.yml up -d
#
# Caddy obtains & renews a Let's Encrypt certificate for SITE_DOMAIN automatically
# (ports 80 + 443 must be open to the internet). The frontend image is domain-agnostic:
# it calls the API on the same origin, which nginx proxies to the backend.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  backend:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER to your GitHub org/user}/stitches-backend:${TAG:-latest}
    restart: unless-stopped
    env_file: ../../backend/.env
    environment:
      - SELF_HOSTED=true
      - MONGO_URL=mongodb://mongo:27017
      - DB_NAME=${DB_NAME:-stitches}
    depends_on:
      - mongo
    expose:
      - "8001"

  web:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER to your GitHub org/user}/stitches-frontend:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SITE_DOMAIN=${SITE_DOMAIN:?Set SITE_DOMAIN to your public domain}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  mongo_data:
  caddy_data:
  caddy_config:
