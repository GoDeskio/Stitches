# nginx site for a self-hosted Stitches install.
# Serves the built React SPA and proxies /api + /ws to the backend on :8001.
# For HTTPS, run `certbot --nginx -d your-domain` after this is working on :80.
server {
    listen 80;
    server_name {{DOMAIN}};

    client_max_body_size 50m;
    root {{APP_DIR}}/frontend/build;
    index index.html;

    # WebSocket + REST API -> backend
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
