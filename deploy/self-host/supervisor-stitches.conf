; Supervisor programs for a self-hosted Stitches install.
; Program names are "backend"/"frontend" to match scripts/update.sh (supervisorctl restart backend frontend).
; The frontend is served as static files by nginx (see nginx-stitches.conf); the "frontend" program
; below just triggers an nginx reload so a freshly-built bundle is served after each update.

[program:backend]
command={{APP_DIR}}/venv/bin/uvicorn server:app --host 0.0.0.0 --port 8001 --workers 2
directory={{APP_DIR}}/backend
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=15
environment=PYTHONUNBUFFERED="1",SELF_HOSTED="true"
stdout_logfile=/var/log/stitches/backend.out.log
stderr_logfile=/var/log/stitches/backend.err.log

[program:frontend]
command=/bin/bash -c "nginx -s reload || true; sleep 2"
autostart=true
autorestart=false
startsecs=0
exitcodes=0
stdout_logfile=/var/log/stitches/frontend.out.log
stderr_logfile=/var/log/stitches/frontend.err.log
